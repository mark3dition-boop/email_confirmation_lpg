<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Confirmed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    keyframes: {
                        scaleUp: {
                            '0%': { transform: 'scale(0)', opacity: '0' },
                            '60%': { transform: 'scale(1.1)', opacity: '1' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        },
                        checkDraw: {
                            '0%': { strokeDashoffset: '50' },
                            '100%': { strokeDashoffset: '0' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(12px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: '0.4', transform: 'scale(1)' },
                            '50%': { opacity: '0.8', transform: 'scale(1.05)' },
                        }
                    },
                    animation: {
                        scaleUp: 'scaleUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                        checkDraw: 'checkDraw 0.4s ease-out 0.3s forwards',
                        fadeIn: 'fadeIn 0.6s ease-out 0.2s forwards',
                        fadeInDelay: 'fadeIn 0.6s ease-out 0.4s forwards',
                        pulseGlow: 'pulseGlow 3s infinite ease-in-out',
                    }
                }
            }
        }
    </script>
    <style>
        .stroke-dash-check {
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
        }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 font-sans flex flex-col justify-between antialiased transition-colors duration-300">

    <!-- Main Content Container -->
    <main class="w-full max-w-md mx-auto px-6 py-8 flex-1 flex flex-col justify-center items-center text-center">
        
        <div class="w-full bg-white dark:bg-slate-800 rounded-3xl p-8 shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-100 dark:border-slate-700/60 relative overflow-hidden transition-all duration-300">
            
            <!-- Glow background effect -->
            <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-40 h-40 bg-emerald-500/10 dark:bg-emerald-500/20 rounded-full blur-2xl pointer-events-none animate-pulseGlow"></div>

            <!-- Success Icon with Animation -->
            <div class="relative flex justify-center mb-6">
                <div class="w-20 h-20 rounded-full bg-emerald-50 dark:bg-emerald-950/50 flex items-center justify-center animate-scaleUp">
                    <div class="w-16 h-16 rounded-full bg-emerald-500 flex items-center justify-center shadow-lg shadow-emerald-500/30">
                        <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path class="stroke-dash-check animate-checkDraw" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Confirmation Text -->
            <div class="opacity-0 animate-fadeIn space-y-3">
                <span class="inline-block px-3 py-1 bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300 text-xs font-semibold rounded-full tracking-wide uppercase">
                    Success
                </span>
                <h1 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">
                    Email Confirmed
                </h1>
                <p class="text-slate-600 dark:text-slate-300 text-base leading-relaxed px-2">
                    Please return to the app to continue.
                </p>
            </div>

            <!-- Deep Link Action Button -->
            <!--<div class="mt-8 space-y-3 opacity-0 animate-fadeInDelay">
                <a id="openAppBtn" href="myapp://open" class="block w-full py-3.5 px-6 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/25 transition duration-200 text-center text-sm sm:text-base">
                    Open App
                </a>
                
                <p id="countdownText" class="text-xs text-slate-400 dark:text-slate-500">
                    Attempting to redirect automatically in <span id="timer" class="font-medium text-slate-600 dark:text-slate-300">3</span>s...
                </p>
            </div>-->

            <!-- Fallback Helper -->
            <div class="mt-6 pt-6 border-t border-slate-100 dark:border-slate-700/50 text-xs text-slate-400 dark:text-slate-500">
                Having trouble? You can safely close this browser tab after returning to the application.
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md mx-auto px-6 pb-6 text-center text-xs text-slate-400 dark:text-slate-500">
        &copy; <span id="year"></span> mark3dition-boop. All rights reserved.
    </footer>

    <script>
        // Set dynamic year
        document.getElementById('year').textContent = new Date().getFullYear();

        // Dark Mode Logic
        const themeToggleBtn = document.getElementById('themeToggle');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');

        // Check system preference or saved preference
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            sunIcon.classList.remove('hidden');
            moonIcon.classList.add('hidden');
        } else {
            document.documentElement.classList.remove('dark');
            sunIcon.classList.add('hidden');
            moonIcon.classList.remove('hidden');
        }

        // Toggle handler
        themeToggleBtn.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            }
        });

        // Deep Link Auto-trigger with Countdown
        let secondsLeft = 3;
        const timerElement = document.getElementById('timer');
        const appBtn = document.getElementById('openAppBtn');
        const deepLinkUrl = appBtn.getAttribute('href');

        const countdown = setInterval(() => {
            secondsLeft -= 1;
            if (timerElement) {
                timerElement.textContent = secondsLeft;
            }
            if (secondsLeft <= 0) {
                clearInterval(countdown);
                // Attempt to open custom URI scheme or deep link
                window.location.href = deepLinkUrl;
            }
        }, 1000);

        // Allow manual trigger
        appBtn.addEventListener('click', (e) => {
            // Can be customized with fallback store links or custom redirect handlers
            console.log('Attempting deep link navigation to:', deepLinkUrl);
        });
    </script>
</body>
</html>
